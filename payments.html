<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WashWise - Payments</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">WashWise</div>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="customer.html">Customer</a>
        <a href="services.html">Services</a>
        <a href="orders.html">Orders</a>
        <a href="payments.html" class="active">Payments</a>
    </nav>

</header>


<main class="page">

    <div class="page-header">

        <h1>Payments</h1>

        <p>
            Manage customer laundry payments.
        </p>

    </div>


    <div class="content-box">

        <h2>Process Payment</h2>

        <form id="paymentForm">

            <label>Select Order</label>

            <select id="paymentOrder" required>

                <option value="">
                    Select order
                </option>

            </select>


            <label>Payment Method</label>

            <select id="paymentMethod" required>

                <option value="">
                    Select payment method
                </option>

                <option value="Online Payment">
                    Online Payment
                </option>

                <option value="Cash">
                    Cash
                </option>

            </select>


            <button type="submit">
                Confirm Payment
            </button>


            <p id="paymentMessage"></p>

        </form>

    </div>


    <div class="content-box">

        <h2>Payment Records</h2>

        <table>

            <thead>

                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Status</th>
                </tr>

            </thead>


            <tbody id="paymentTable">

            </tbody>

        </table>

    </div>

</main>


<footer>
    <p>© 2026 WashWise Laundry Management System</p>
</footer>


<script src="script.js"></script>

</body>
</html>
